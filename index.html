<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coverage Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100%; position: relative; }

    /* Sidebar overlay (dark glass) */
    #sidebar{
      position: absolute;
      top: 16px;
      left: 16px;
      width: 380px;
      height: calc(100vh - 32px);
      z-index: 1200;

      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      color: rgba(255,255,255,0.92);
      overflow-y: auto;
    }

    .panel{ padding: 18px; }
    .title-block{ padding-left: 12px; margin-bottom: 14px; }
    .title-block h1{ margin:0; font-size: 30px; line-height: 1.15; font-family: "Sarabun", sans-serif; font-weight: 750;}
    .title-block h2{ margin:4px 0 0 0; font-size: 18px; font-weight: 500; opacity: .9; font-family: "Sarabun", sans-serif; font-weight: 400;}
    .title-block::after{
      content:"";
      display:block;
      width: 70px;
      height: 3px;
      background: rgba(255,255,255,0.55);
      margin-top: 10px;
      border-radius: 999px;
    }

    .description{ margin: 10px 0 0; opacity: .9; padding-left: 12px; }

    .kpi{ margin-top: 14px; padding-left: 12px; font-size: 14px; line-height: 1.45; font-family: "Sarabun", sans-serif; font-weight: 400;}
    .kpi-number{ font-size: 2.3em; font-weight: 750; line-height: 1.1; display: inline-block; font-family: "Sarabun", sans-serif; }
    .kpi-unit{ font-size: 1.8em; margin-left: 4px; font-family: "Sarabun", sans-serif; }

    .chart-wrap{ margin-top: 14px; }
    #coverage-chart{
      width: 100%;
      height: 240px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* Slider overlay on map */
    #radius-control{
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1300;

      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      color: rgba(255,255,255,0.92);
      padding: 10px 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }
    #radius-slider{ width: 240px; }

    #filters{
      position: absolute;
      top: 96px;          /* 👈 ต่ำกว่า slider นิดหนึ่ง */
      right: 16px;
      z-index: 1300;
    }

    .filters-panel{
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;

      padding: 12px 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);

      color: rgba(255,255,255,0.92);
      font-size: 14px;
    }

    .filters-panel label{
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 4px 2px;     /* 👈 ลดจาก 6px 4px */
      margin: 0;            /* กัน margin แฝง */
      cursor: pointer;

      opacity: 0.95;
    }

    .filters-panel label:hover{
      opacity: 1;
    }

    .filters-panel input[type="checkbox"]{
      width: 16px;
      height: 16px;
      accent-color: #3b82f6; /* น้ำเงินเดียวกับ slider */
      cursor: pointer;
    }

    /* Move leaflet controls away from sidebar */
    .leaflet-top.leaflet-left { margin-left: 420px; }
  </style>
</head>

<body>
  <div id="map">
    <aside id="sidebar">
      <div class="panel">
        <div class="title-block">
          <h1>ความครอบคลุมประชากร</h1>
          <h2>ภายใต้หน่วยบริการปฐมภูมิ</h2>
        </div>

        <div class="kpi">
          ประชาชนที่อยู่ในรัศมีรอบหน่วยบริการ
          <strong><span id="sidebar-radius">1.0</span> กิโลเมตร</strong>อยู่ที่<br/>
          <strong>
            <span id="coverage" class="kpi-number">38,513,218</span>
            <span class="kpi-unit">คน</span>
          </strong>
        </div>

        <div class="chart-wrap">
          <canvas id="coverage-chart"></canvas>
        </div>
      </div>

    </aside>

    <div id="radius-control">
      <div>
        รัศมี: <strong><span id="radius-label">1.0</span> กิโลเมตร</strong>
      </div>
      <input id="radius-slider" type="range" min="0.1" max="10.0" step="0.1" value="1.0" />
    </div>
    
    <div id="filters">
      <div class="filters-panel">
        <label><input type="checkbox" id="cb-public" checked> หน่วยบริการปฐมภูมิ</label>
        <label><input type="checkbox" id="cb-pharm" checked> ร้านยาเภสัชกรรม</label>
        <label><input type="checkbox" id="cb-nurse" checked> คลินิกพยาบาล</label>
        <label><input type="checkbox" id="cb-doctor" checked> คลินิกเวชกรรม</label>
        <label><input type="checkbox" id="cb-other" checked> อื่น ๆ</label>
      </div>
    </div>


  </div>

  <!-- libs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>

  <!-- app -->
  <script src="script.js"></script>
</body>
</html>
