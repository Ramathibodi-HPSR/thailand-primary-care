# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # The dashboard bundle is plain git (about 4 MB); the LFS files under
      # data/raw are pipeline inputs the site does not need, so skip them.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check the dashboard bundle is complete
        run: |
          for f in dashboard/index.html dashboard/app.js dashboard/style.css dashboard/data/facts.json dashboard/data/charts.json dashboard/data/hex6.json dashboard/data/units.csv dashboard/data/sites.csv dashboard/data/provinces.geojson; do
            test -s "$f" || { echo "ERROR: $f is missing or empty"; exit 1; }
            if head -n 1 "$f" | grep -q "git-lfs.github.com/spec"; then
              echo "ERROR: $f is an LFS pointer"; exit 1
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
